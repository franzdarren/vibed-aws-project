<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI Photo Tagger{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('main.gallery') }}">📷 AI Photo Tagger</a>
    <a class="btn btn-primary" href="{{ url_for('main.upload_form') }}">+ Upload</a>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
